name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap core assets
        run: bash scripts/bootstrap-core-assets.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Install dependencies
        working-directory: SSRVPN_Android
        run: flutter pub get

      - name: Generate signing key
        run: |
          keytool -genkey -v -keystore $HOME/debug-key.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -alias androiddebugkey -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
          echo "storeFile=$HOME/debug-key.jks" > SSRVPN_Android/android/key.properties
          echo "storePassword=android" >> SSRVPN_Android/android/key.properties
          echo "keyAlias=androiddebugkey" >> SSRVPN_Android/android/key.properties
          echo "keyPassword=android" >> SSRVPN_Android/android/key.properties

      - name: Build APK
        working-directory: SSRVPN_Android
        run: flutter build apk --release --target-platform=android-arm64

      - name: Rename APK
        run: cp SSRVPN_Android/build/app/outputs/flutter-apk/app-release.apk SSRVPN_Android/build/app/outputs/flutter-apk/qingfan.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 清凡公益代理 v5.2.0
          body: |
            清凡公益代理 v5.2.0
            - 预置固定订阅链接
            - 版本号 5.2.0
          files: SSRVPN_Android/build/app/outputs/flutter-apk/qingfan.apk
          make_latest: true
          
