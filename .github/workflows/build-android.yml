name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap core assets
        run: bash scripts/bootstrap-core-assets.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Install dependencies
        working-directory: SSRVPN_Android
        run: flutter pub get

      - name: Build APK
        working-directory: SSRVPN_Android
        run: flutter build apk --release --target-platform=android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qingfan-proxy
          path: SSRVPN_Android/build/app/outputs/flutter-apk/app-release.apk
          
